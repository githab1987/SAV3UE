<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ALI - Autonomous Financial Investigation</title>
    <style>
        :root {
            --navy: #0f172a;
            --navy-dark: #020617;
            --green: #10b981;
            --green-dark: #059669;
            --bg: #f8fafc;
            --text: #334155;
            --border: #e2e8f0;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); line-height: 1.5; min-height: 100vh; }
        
        /* Perbaikan Layar Blur / Modal Overlay Full Screen */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            inset: 0;
            background: rgba(15, 23, 42, 0.6);
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }
        .modal-overlay.active {
            opacity: 1;
            visibility: visible;
        }

        .modal-card {
            background: #fff;
            padding: 2.5rem;
            border-radius: 0.75rem;
            width: 90%;
            max-width: 420px;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
            transform: translateY(10px);
            transition: transform 0.3s ease;
        }
        .modal-overlay.active .modal-card {
            transform: translateY(0);
        }

        header { display: flex; justify-content: space-between; align-items: center; padding: 1rem 2rem; background: #fff; border-bottom: 1px solid var(--border); }
        .logo { font-weight: 700; font-size: 1.25rem; color: var(--navy); }
        .btn { background: var(--green); color: #fff; border: none; padding: 0.75rem 1.5rem; border-radius: 0.375rem; cursor: pointer; font-weight: 600; transition: background 0.2s; }
        .btn:hover { background: var(--green-dark); }
        
        .hero { text-align: center; padding: 6rem 1rem; }
        .hero h1 { font-size: 2.5rem; color: var(--navy); margin-bottom: 1rem; }
        .hero p { color: #64748b; margin-bottom: 2rem; max-width: 600px; margin-left: auto; margin-right: auto; }
        
        .form-input {
            width: 100%;
            padding: 0.75rem;
            margin-bottom: 1rem;
            border: 1px solid var(--border);
            border-radius: 0.375rem;
            font-size: 1rem;
        }
        .form-input:focus {
            outline: none;
            border-color: var(--green);
        }
    </style>
</head>
<body>

    <!-- Modal Autentikasi / Layar Blur Full Screen -->
    <div id="authModal" class="modal-overlay active">
        <div class="modal-card">
            <h2 style="margin-bottom: 0.5rem; color: var(--navy);">Masuk ke ALI</h2>
            <p style="margin-bottom: 1.5rem; color: #64748b; font-size: 0.875rem;">Platform Investigasi & Rekonsiliasi Keuangan Otonom.</p>
            <input type="email" class="form-input" placeholder="Email Perusahaan">
            <input type="password" class="form-input" placeholder="Kata Sandi">
            <button class="btn" style="width: 100%; margin-top: 0.5rem;" onclick="closeModal()">Masuk Sekarang</button>
        </div>
    </div>

    <!-- Halaman Utama -->
    <div id="appContainer">
        <header>
            <div class="logo">ALI Protocol</div>
            <button class="btn" onclick="openModal()">Autentikasi</button>
        </header>
        <section class="hero">
            <h1>Autonomous Financial Investigation</h1>
            <p>Otomatisasi audit, rekonsiliasi data keuangan, dan deteksi anomali dengan pengawasan manusia secara real-time.</p>
            <button class="btn" onclick="openModal()">Mulai Investigasi</button>
        </section>
    </div>

    <script>
        function closeModal() {
            document.getElementById('authModal').classList.remove('active');
        }
        function openModal() {
            document.getElementById('authModal').classList.add('active');
        }
    </script>
</body>
</html>
